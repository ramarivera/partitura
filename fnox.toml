default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1hx3ulr3sgvywwceg3nujh8lr0e7emvl86333kpjvkpsqaq8wdcds29f4xz"]
key_file = "~/.config/mise/age.txt"

[secrets]
LINEAR_CLIENT_ID= { provider = "age", value = "" }
LINEAR_CLIENT_SECRET= { provider = "age", value = "" }
LINEAR_WEBHOOK_SECRET= { provider = "age", value = "" }
TOKEN_ENCRYPTION_KEY= { provider = "age", value = "" }
PUBLIC_URL= { provider = "age", value = "" }
GITHUB_APP_ID= { provider = "age", value = "" }
GITHUB_APP_PRIVATE_KEY= { provider = "age", value = "" }
DEV_LINEAR_API_KEY= { provider = "age", value = "" }
SYMPHONY_DEPLOY_CLIPROXYAPI_API_KEY= { provider = "age", value = "" }
PARTITURA_NATIVE_BUILD_SSH_KEY= { provider = "partitura-native", value = "" }
PARTITURA_NATIVE_BUILD_TARGET= { provider = "partitura-native", value = "" }
PARTITURA_NATIVE_BUILD_KNOWN_HOSTS= { provider = "partitura-native", value = "" }
WORKER_REPOSITORY_AGE_KEYS_JSON= { provider = "age", value = "" }
# Encrypted gateway and deployment secrets. `fnox set <KEY>` adds ciphertext here
# using the configured default age provider; plaintext is only exposed to
# child processes launched through `fnox exec`.
#
# Required runtime values:
# - LINEAR_CLIENT_ID
# - LINEAR_CLIENT_SECRET
# - LINEAR_WEBHOOK_SECRET
# - TOKEN_ENCRYPTION_KEY
# - PUBLIC_URL
# SYMPHONY_DEPLOY_CLIPROXYAPI_API_KEY is consumed by toolbox pre-up only,
# which writes the CLIPROXYAPI_API_KEY Docker secret file. Native fnox exec
# leaves model routing unset unless its key and base URL are both configured.

[providers.partitura-native]
type = "age"
recipients = ["age12a493ftycr69mk7ksuf57v75td6c5j5fur4xj0zu2vh39qpuc5ssqaeyhr"]
key_file = "~/.config/fnox/partitura-native-age.key"
